
name: Deploy Monster Kundenportal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Anwendung bauen
        run: npm run build
        env:
          VITE_BASE_PATH: /monster-kundenportal/

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Dateien hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
